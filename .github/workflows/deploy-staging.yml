name: Deploy Staging

# Staging deploys automatically on every merge to main, after the CI
# quality gate. Order: build images -> migration gate -> deploy services.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [quality-gate]
    # Skip cleanly until cloud credentials are configured in repo settings.
    if: vars.GCP_PROJECT_ID != ''
    permissions:
      contents: read
      id-token: write # Workload Identity Federation — no stored keys
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: services/api/Dockerfile
            context: .
          - service: voice
            dockerfile: services/voice/Dockerfile
            context: .
          - service: worker
            dockerfile: services/worker/Dockerfile
            context: .
          - service: web
            dockerfile: apps/dashboard/Dockerfile
            context: apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: receptionist-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push
        run: |
          IMAGE="${REGISTRY}/${PROJECT_ID}/receptionist/receptionist-${{ matrix.service }}:${GITHUB_SHA}"
          docker build -f ${{ matrix.dockerfile }} -t "$IMAGE" ${{ matrix.context }}
          docker push "$IMAGE"

  migrate:
    name: Migration gate (staging)
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run migrations against staging
        env:
          DATABASE_DIRECT_URL: ${{ secrets.STAGING_DATABASE_DIRECT_URL }}
        run: uv run alembic upgrade head

  deploy:
    name: Deploy ${{ matrix.service }} (staging)
    runs-on: ubuntu-latest
    needs: [migrate]
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [api, voice, worker, web]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: receptionist-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        env:
          ENVIRONMENT: staging
          IMAGE: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/receptionist/receptionist-${{ matrix.service }}:${{ github.sha }}
        run: bash infra/scripts/deploy-service.sh ${{ matrix.service }}
