name: CI

# Runs directly on pull requests; on main it runs as the quality-gate
# stage of the staging deploy (workflow_call), avoiding duplicate runs.
on:
  pull_request:
  workflow_call:

jobs:
  python:
    name: Python — lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: receptionist_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:55432/receptionist_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy packages services

      - name: Pytest
        run: uv run pytest -q

      # Exit 2 means a safety property regressed; exit 1 is a quality
      # failure. Both fail the build, but the code distinguishes them in
      # the log and lets the report be read before triage.
      - name: Evaluation suite
        run: uv run python -m ai_evals.cli --require-coverage --out eval-results

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-results/
          if-no-files-found: ignore

  dashboard:
    name: Dashboard — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f services/api/Dockerfile .

      - name: Build voice image
        run: docker build -f services/voice/Dockerfile .

      - name: Build worker image
        run: docker build -f services/worker/Dockerfile .

      - name: Build web image
        run: docker build -f apps/dashboard/Dockerfile apps/dashboard
