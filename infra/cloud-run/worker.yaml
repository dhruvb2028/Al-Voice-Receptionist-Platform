# Cloud Run service definition — Worker (post-call processing).
# Deploy: envsubst < infra/cloud-run/worker.yaml | gcloud run services replace -
# Required substitutions: PROJECT_ID, REGION, ENVIRONMENT, IMAGE
#
# QStash-triggered HTTP consumer:
# - Scale to zero; QStash delivery wakes it.
# - Every endpoint verifies the QStash signature before side effects.
# - Handlers are idempotent by call_id — at-least-once delivery is safe.
# - timeoutSeconds 300 bounds one job execution; longer work must be
#   split into chained QStash messages.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: receptionist-worker-${ENVIRONMENT}
  labels:
    app: receptionist
    component: worker
    environment: ${ENVIRONMENT}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      serviceAccountName: receptionist-worker@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 10
      timeoutSeconds: 300
      containers:
        - image: ${IMAGE}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: ENVIRONMENT
              value: ${ENVIRONMENT}
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
