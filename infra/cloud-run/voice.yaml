# Cloud Run service definition — Voice (realtime call path).
# Deploy: envsubst < infra/cloud-run/voice.yaml | gcloud run services replace -
# Required substitutions: PROJECT_ID, REGION, ENVIRONMENT, IMAGE, MIN_INSTANCES
#
# Design constraints:
# - WebSocket support: native on Cloud Run; timeoutSeconds bounds the
#   longest call (3600s).
# - CPU always allocated (cpu-throttling: false): audio must be processed
#   between requests' response phases.
# - Session affinity: Twilio's media WebSocket must stay on one instance.
# - containerConcurrency 2 = two active calls per instance. With maxScale 3
#   the platform hard-caps at 6 concurrent calls — the "maximum active-call
#   protection". New calls beyond capacity are rejected at the webhook with
#   a courteous unavailable message rather than degrading live calls.
# - Graceful draining: SIGTERM → uvicorn stops accepting, in-flight calls
#   run to completion (timeout-graceful-shutdown 3600).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: receptionist-voice-${ENVIRONMENT}
  labels:
    app: receptionist
    component: voice
    environment: ${ENVIRONMENT}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "${MIN_INSTANCES}"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/sessionAffinity: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: receptionist-voice@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 2
      timeoutSeconds: 3600
      containers:
        - image: ${IMAGE}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
          env:
            - name: ENVIRONMENT
              value: ${ENVIRONMENT}
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
