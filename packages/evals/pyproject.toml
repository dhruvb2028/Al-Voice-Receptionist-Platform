[project]
name = "ai-evals"
version = "0.1.0"
description = "Evaluation harness: versioned cases, assertions, and regression reports"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "ai-domain",
    "ai-providers",
]

[tool.uv.sources]
ai-domain = { workspace = true }
ai-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_evals"]
