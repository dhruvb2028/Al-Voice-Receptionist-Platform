  timezone: America/New_York
  services:
  - Drain Cleaning
  - Leak Repair
  - Water Heater Repair
  approved_prices:
    Drain Cleaning: $149 flat
    Leak Repair: $95 to $250
  postal_codes:
  - '11201'
  - '11215'
  open_hours: 09:00-17:00
  max_call_seconds: 900
persona:
  mood: neutral
  description: Forgets the address.
script:
- caller: Can you come Wednesday?
  reply: Yes — what's the address for the visit?
  latency_ms: 900
- caller: 12 Cedar Street, 11201.
  reply: Thanks. Checking Wednesday for that address.
  latency_ms: 900
  tool_calls:
  - tool: check_service_area
    status: success
    result:
      covered: true
