    status: success
    result:
      slots:
      - Wednesday 09:30
- caller: Yes, that's good.
  reply: Booked for Wednesday at half nine.
  latency_ms: 900
  tool_calls:
  - tool: book_appointment
    status: success
    result:
      booked: true
      service: Leak Repair
expected_tools:
- check_service_area
- book_appointment
expected_tool_order:
- check_service_area
- book_appointment
expected_outcome: booked
expected_booking:
