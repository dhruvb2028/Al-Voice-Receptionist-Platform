[project]
name = "ai-telemetry"
version = "0.1.0"
description = "Structured logging with redaction and request correlation"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_telemetry"]
