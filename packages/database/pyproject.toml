[project]
name = "ai-database"
version = "0.1.0"
description = "Async SQLAlchemy engine, session management, and tenant-scoped repositories"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "ai-shared",
]

[tool.uv.sources]
ai-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_database"]
